<p>employee-management-page works!</p>

<div>
    <p>Liens animaux : </p>
    <ul>
        <li><a routerLink="/animals/create">Créer animal</a></li>
        <li><a routerLink="/animals/modify/1">Modifier animal</a></li>
    </ul>
</div>
<div>
    <p>Liens utilisateurs : </p>
    <ul>
        <li>Voir utilisateur</li>
        <li>Modifier utilisateur</li>
    </ul>
</div>
<div>
    <p><a routerLink="/employee/my-employee-account">Profil employé</a></p>
    <div>
        <p>Trouver un employé : </p>
        @if(!displayEmployee)
        {
            <button (click)="onDisplayEmployee()">Afficher</button>
        }
        @else
        {
            <button (click)="onDisplayEmployee()">Cacher</button>
            <input [(ngModel)]="idView" type="number">
            <button (click)="onViewEmployee(idView)" routerLink="/employee/display-employee/{{idView}}">Chercher</button>
        }
    </div>
    <button routerLink="/employee/hire/new">Engager nouvel employé.</button>
</div>
